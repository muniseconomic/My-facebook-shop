[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-platform"
version = "1.0.0"
description = "In-house AML / KYC / CFT compliance platform for a financial institution's compliance unit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Compliance Engineering" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rapidfuzz>=3.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["aml_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
